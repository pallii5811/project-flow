name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # The content pipeline on real files: every gate rule refused on purpose,
      # real endings accepted, and a refused re-delivery proven to leave the
      # published series byte for byte as it was.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run proof:gate
