# What this is: the owner sends a studio's link to this workflow from his phone.
# The video is downloaded HERE, on a GitHub runner, never on his computer: it is
# cut into episodes, packaged, and uploaded to Cloudflare R2. Only small files
# come back — a manifest committed to master, and contact sheets to look at.
# The owner's guide is docs/cloud-ingest.md; the design is docs/decisions.md.
name: ingest from link

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Series slug (the folder under content/series, e.g. signal-night)"
        required: true
        type: string
      links:
        description: "Link(s) to the delivery, separated by spaces (Dropbox, Google Drive, WeTransfer, https)"
        required: true
        type: string
      mode:
        description: "propose-cuts = look at one long file and propose where the episodes are. publish = package and put online."
        required: true
        default: propose-cuts
        type: choice
        options:
          - propose-cuts
          - publish
      continuation:
        description: "Leave at 0. A run that could not finish sets it to continue itself."
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # One run per series: two runs would encode the same episodes twice.
  group: ingest-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    # A job may run 6 hours; this leaves room for the steps after the work.
    timeout-minutes: 350
    env:
      # Pinned: the same ffmpeg every time, checked against the hash its author
      # published. A build of the month is kept for two years (BtbN/FFmpeg-Builds).
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-02-28-12-59/ffmpeg-n8.0.1-66-g27b8d1a017-linux64-gpl-8.0.tar.xz
      FFMPEG_SHA256: 26d2ecd0cefba99f9d1ea92252a3a4f743a58df4c1c3cf9f8bbaaa40b1fca5b0
      # Never interpolated into a shell line: what the owner typed is data.
      SLUG: ${{ inputs.slug }}
      LINKS: ${{ inputs.links }}
    steps:
      - name: Note when this job started
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Make room on the disk
        # A runner has about 14 GB free; a 90-minute delivery and the episodes
        # cut from it need most of it. These are toolchains nothing here uses.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h / | tail -1

      - name: Install the pinned ffmpeg
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL "$FFMPEG_URL" -o ffmpeg.tar.xz
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ffmpeg && tar -xJf ffmpeg.tar.xz -C ffmpeg --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Check this ffmpeg can do the work
        run: node scripts/check-ffmpeg.mjs

      - name: Download the delivery
        run: |
          set -euf -o pipefail
          node scripts/fetch-delivery.mjs --out "$RUNNER_TEMP/delivery" $LINKS

      - name: What is already on the media store (from the last run)
        if: inputs.mode == 'publish'
        uses: actions/cache/restore@v4
        with:
          path: .ingest-records
          key: ingest-records-${{ inputs.slug }}-${{ github.run_id }}
          restore-keys: |
            ingest-records-${{ inputs.slug }}-

      - name: Propose where the episodes are
        if: inputs.mode == 'propose-cuts'
        run: |
          set -euo pipefail
          node scripts/split-compilation.mjs propose "$SLUG" \
            --input "$RUNNER_TEMP/delivery" \
            --out ".split-work/$SLUG"

      - name: Package the episodes and put them on the media store
        if: inputs.mode == 'publish'
        env:
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set +e
          node scripts/cloud-ingest.mjs "$SLUG" --source "$RUNNER_TEMP/delivery" --budget-minutes 300
          code=$?
          set -e
          echo "INGEST_EXIT=$code" >> "$GITHUB_ENV"
          df -h / | tail -1
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Remember what is on the media store, for the next run
        if: always() && inputs.mode == 'publish'
        uses: actions/cache/save@v4
        with:
          path: .ingest-records
          key: ingest-records-${{ inputs.slug }}-${{ github.run_id }}

      - name: Send the proposal back (contact sheets and the cuts file)
        if: inputs.mode == 'propose-cuts'
        uses: actions/upload-artifact@v4
        with:
          name: cuts-${{ inputs.slug }}
          path: .split-work/${{ inputs.slug }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish the manifest (this is what puts the series online)
        if: inputs.mode == 'publish' && env.INGEST_EXIT == '0'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain packages/feed-domain/src/data/generated)" ]; then
            echo "no manifest change: the catalog already pointed at these episodes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/feed-domain/src/data/generated
          git commit -m "Ingest: ${SLUG} from a studio link (run ${GITHUB_RUN_ID})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Continue in another run (the series is longer than one job)
        if: inputs.mode == 'publish' && env.INGEST_EXIT == '3' && fromJSON(inputs.continuation) < 8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          set -euo pipefail
          next=$(( CONTINUATION + 1 ))
          echo "Part of ${SLUG} is on the media store. Starting run $next to continue." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run ingest-from-link.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f slug="$SLUG" \
            -f links="$LINKS" \
            -f mode=publish \
            -f continuation="$next"

      - name: Say how many runner minutes this used
        if: always()
        run: |
          set -euo pipefail
          minutes=$(( ( $(date +%s) - STARTED_AT + 59 ) / 60 ))
          {
            echo ""
            echo "This run used about **${minutes} runner minutes**."
            echo ""
            echo "A private repository gets 2,000 free minutes a month:"
            echo "about $(( 2000 / (minutes > 0 ? minutes : 1) )) runs like this one."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "runner minutes: ${minutes}"
