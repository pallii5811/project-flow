name: Batch YouTube Ingest (Dynamic)

on:
  push:
    paths:
      - 'links.txt'
  workflow_dispatch:

jobs:
  orchestrate:
    name: Orchestrate YouTube Batch
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      
      - name: Diagnose Scaleway
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_ZONE: ${{ secrets.SCW_ZONE }}
        run: node scripts/diagnose-scaleway.mjs

      - name: Install dependencies
        run: npm ci

      - name: Process links one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_ZONE: ${{ secrets.SCW_ZONE }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          
          # Read valid URLs
          urls=()
          while IFS= read -r line || [ -n "$line" ]; do
            line_trimmed=$(echo "$line" | xargs)
            if [ -n "$line_trimmed" ] && [[ "$line_trimmed" != "#"* ]]; then
              urls+=("$line_trimmed")
            fi
          done < links.txt

          if [ ${#urls[@]} -eq 0 ]; then
            echo "No URLs to process."
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Clean up any leftover machines from cancelled runs
          node scripts/run-on-scaleway.mjs --sweep --older-than-minutes 0 --force || true
          
          processed=0
          for url in "${urls[@]}"; do
            echo "----------------------------------------"
            echo "Processing $url"
            
            slug=$(node scripts/init-series.mjs "$url")
            if [ -z "$slug" ]; then
              echo "Failed to extract slug for $url"
              continue
            fi
            
            git add "content/series/$slug/series.json"
            git commit -m "chore: setup series $slug [skip ci]" || true
            
            echo "Spawning dynamic Scaleway machine for $slug..."
            
            # This calls the script which spawns the machine, runs auto-publish, and destroys the machine.
            # It also automatically extracts the manifest to the local workspace via COLLECTED mechanism.
            if node scripts/run-on-scaleway.mjs "$slug" --links "$url" --mode auto-publish --budget-minutes 360; then
              echo "Successfully published $slug"
              if [ -f ".split-work/$slug/$slug.cuts.json" ]; then
                cp ".split-work/$slug/$slug.cuts.json" "content/series/$slug/cuts.json"
              fi
              
              # Clean up the processed URL from links.txt immediately
              grep -v -F "$url" links.txt > links.txt.tmp && mv links.txt.tmp links.txt
              
              if [ -n "$(git status --porcelain packages/feed-domain/src/data/generated content/series links.txt)" ]; then
                git add packages/feed-domain/src/data/generated content/series links.txt
                git commit -m "Ingest: $slug published by dynamic worker [skip ci]" || true
              fi
              
              # Pull before push to avoid conflicts
              git pull --rebase origin "${{ github.ref_name }}" || true
              git push origin "${{ github.ref_name }}" || true
              
              processed=$((processed + 1))
            else
              echo "Warning: Ingest for $slug failed or was refused. Moving to next link..."
              grep -v -F "$url" links.txt > links.txt.tmp && mv links.txt.tmp links.txt
              echo "$url" >> failed_links.txt
              git add links.txt failed_links.txt
              git commit -m "chore: move failed link $slug to failed_links.txt [skip ci]" || true
              git pull --rebase origin "${{ github.ref_name }}" || true
              git push origin "${{ github.ref_name }}" || true
            fi
            
            # We process maximum 5 links per GitHub run to avoid 6-hour timeout
            if [ "$processed" -ge 5 ]; then
              echo "Reached limit of 5 videos per run to avoid 6-hour limit."
              break
            fi
          done
          
          remaining_urls=()
          while IFS= read -r line || [ -n "$line" ]; do
            line_trimmed=$(echo "$line" | xargs)
            if [ -n "$line_trimmed" ] && [[ "$line_trimmed" != "#"* ]]; then
              remaining_urls+=("$line_trimmed")
            fi
          done < links.txt
          
          if [ ${#remaining_urls[@]} -gt 0 ]; then
            echo "Processed $processed successful series this run. There are still ${#remaining_urls[@]} URLs remaining in links.txt."
            echo "Triggering next batch run automatically..."
            gh workflow run batch-ingest.yml --ref "${{ github.ref_name }}" || true
          else
            echo "All URLs in links.txt have been processed!"
          fi
